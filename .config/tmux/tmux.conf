# Extended keys, so Shift+Enter reaches the application instead of being
# flattened to a plain Enter. Ghostty already emits the right sequence;
# tmux just has to pass it through. "always" rather than "on" emits the
# CSI-u form unconditionally, which is what Claude Code needs.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
